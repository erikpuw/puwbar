[package]
name = "puwbar-installer"
version = "1.0.7"
edition = "2021"
description = "Lightweight native Win32 GUI installer and uninstaller for PuwBar"
publish = false

[[bin]]
name = "puwbar-setup"
path = "src/main.rs"

[dependencies]
flate2 = "1.1"
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
flate2 = "1.1"
