[workspace]
resolver = "2"
members = [
    ".",
    "crates/puwbar-installer",
]

[package]
name = "puwbar"
version = "1.0.10"
edition = "2021"
description = "Floating frosted glass taskbar styler for Windows 11"
publish = false

[dependencies]
windows-collections = "0.2"
windows-core = "0.61"
windows-numerics = "0.2"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_Storage_Packaging_Appx", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Power", "Win32_System_SystemInformation", "Win32_System_Com", "Win32_UI_Accessibility", "Win32_UI_HiDpi", "Win32_UI_Controls", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows = { version = "0.61.3", features = ["Foundation", "Graphics_Effects", "System", "UI_Composition", "UI_Composition_Desktop", "Win32_System_WinRT", "Win32_System_WinRT_Composition", "Win32_System_WinRT_Graphics_Direct2D", "Win32_Foundation", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Storage_FileSystem", "Win32_Storage_EnhancedStorage", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61.2"
features = ["Win32_System_Registry", "Win32_UI_Shell_Common"]

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
